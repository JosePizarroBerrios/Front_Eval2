name: Deploy Frontend
on:
  push:
    branches: [ "deploy" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push
        run: |
          docker build -t ${{ secrets.DOCKER_USER }}/innovatech-frontend:latest .
          docker push ${{ secrets.DOCKER_USER }}/innovatech-frontend:latest

      - name: SSH Deploy (Amazon Linux)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.SSH_KEY }}
          script: |
            mkdir -p ~/app && cd ~/app

            # Escribimos el archivo usando los secretos directamente para evitar variables vacías
            cat <<EOF > docker-compose.yml
            services:
              frontend:
                image: ${{ secrets.DOCKER_USER }}/innovatech-frontend:latest
                container_name: frontend
                ports:
                  - "80:80"
                environment:
                  - BACKEND_URL=http://${{ secrets.BACKEND_HOST_PRIVATE_IP }}:3000
                restart: always
            EOF

            # Ejecutamos con sudo
            sudo docker-compose pull
            sudo docker-compose up -d --build